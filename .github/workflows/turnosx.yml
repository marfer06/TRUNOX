
name: TurnosX reservar CrossFit

on:
  schedule:
    # Sábado 19:00 UTC = 16:00 Argentina.
    - cron: "0 19 * * 6"

  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        default: solo-sesion
        options:
          - solo-sesion
          - prueba
          - real

# Permisos necesarios para actualizar el secreto del repositorio.
permissions:
  contents: read
  actions: write

jobs:
  reservar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Crear sesion.json desde el secreto
        env:
          TURNOSX_SESION: ${{ secrets.TURNOSX_SESION }}
        run: |
          umask 077
          printf '%s' "$TURNOSX_SESION" > sesion.json

      - name: Ejecutar
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODO: ${{ github.event.inputs.modo || 'real' }}
        run: |
          args=()

          if [ -n "$NTFY_TOPIC" ]; then
            args+=(--aviso "$NTFY_TOPIC")
          fi

          case "$MODO" in
            solo-sesion)
              python reservar_celular.py --solo-sesion "${args[@]}"
              ;;
            prueba)
              python reservar_celular.py --prueba --ahora "${args[@]}"
              ;;
            real)
              python reservar_celular.py "${args[@]}"
              ;;
            *)
              echo "Modo desconocido: $MODO"
              exit 1
              ;;
          esac

      # Guarda la sesión renovada en GitHub, incluso si
      # el script termina con un error.
      - name: Persistir sesión renovada en GitHub
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: |
          if [ -s sesion.json ]; then
            gh secret set TURNOSX_SESION < sesion.json
            echo "Sesión actualizada en GitHub correctamente."
          else
            echo "No hay una sesión válida para guardar."
          fi
